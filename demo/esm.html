<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-matching-fields via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			/* Demo-specific styles */
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<form-matching-fields>
			<p>Replace this markup once you customize form-matching-fields.</p>
		</form-matching-fields>

		<script type="module">
			import { FormMatchingFieldsElement } from 'https://esm.sh/@aarongustafson/form-matching-fields@0.0.1/form-matching-fields.js?bundle&target=es2022';

			if (!customElements.get('form-matching-fields')) {
				customElements.define('form-matching-fields', FormMatchingFieldsElement);
			}
		</script>
	</body>
</html>
